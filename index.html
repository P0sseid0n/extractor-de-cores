<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Extrator de Cores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script type="module" src="/src/main.ts"></script>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <h1>Extrator de Cores</h1>
    </div>
    <p class="subtitle hide-sm">Envie uma foto, extraia a paleta e clique numa cor para copiar o HEX.</p>
  </header>

  <input id="file-input" class="sr-only" type="file" accept="image/*">

  <section id="drop" class="drop" aria-label="Área para soltar a imagem">
    <div id="empty" class="empty">
      <div class="icon">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4"/><path d="M7 9l5-5 5 5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
      </div>
      <div>
        <p class="big">Arraste e solte sua foto aqui</p>
        <p class="small">JPG, PNG, WEBP ou GIF</p>
      </div>
      <label for="file-input" class="btn">Selecionar arquivo</label>
    </div>
    <img id="preview" class="preview" alt="Imagem enviada" hidden>
    <label for="file-input" id="swap" class="btn small swap" hidden>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/></svg>
      Trocar imagem
    </label>
  </section>

  <div class="actions">
    <button id="extract" class="btn primary" type="button" disabled>Extrair cores</button>
    <span id="status" class="status" aria-live="polite">Nenhuma imagem selecionada</span>
    <button id="copy-all" class="btn small" type="button" hidden>Copiar todos</button>
  </div>

  <section id="palette" class="swatches" aria-label="Paleta extraída"></section>
</div>
</body>
</html>
